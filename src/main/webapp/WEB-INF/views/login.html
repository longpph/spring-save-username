<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập &amp; Ghi nhớ Cookie | Spring MVC</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 15% 20%, #eff6ff 0%, #f8fafc 40%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: var(--text-main);
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            padding: 40px 36px;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Cookie status badge */
        .cookie-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .cookie-pill-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cookie-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94a3b8;
        }

        .cookie-indicator.active {
            background-color: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .cookie-val {
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-clear-cookie {
            color: var(--danger);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .btn-clear-cookie:hover {
            background: #fee2e2;
        }

        /* Alerts */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .alert-success {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #065f46;
        }

        .alert-danger {
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: #991b1b;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .input-icon svg {
            width: 18px;
            height: 18px;
        }

        /* Button */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            font-family: inherit;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Demo credentials card */
        .demo-box {
            margin-top: 24px;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .demo-box strong {
            color: var(--text-main);
        }

        .demo-row {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
        }

        .demo-tag {
            font-family: monospace;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            color: #1e293b;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1>Spring Save Username</h1>
            <p>Thực hành thao tác với Cookie trong Spring MVC</p>
        </div>

        <!-- Cookie Status Badge -->
        <div class="cookie-pill">
            <div class="cookie-pill-left">
                <span class="cookie-indicator"
                      th:classappend="${savedUser != null and !savedUser.isEmpty()} ? 'active' : ''"></span>
                <span>Cookie (<code style="font-weight: 600;">setUser</code>):</span>
                <span class="cookie-val"
                      th:text="${savedUser != null and !savedUser.isEmpty()} ? ${savedUser} : 'Chưa có'">
                    Chưa có
                </span>
            </div>
            <a th:if="${savedUser != null and !savedUser.isEmpty()}"
               th:href="@{/clear-cookie}" class="btn-clear-cookie" title="Xóa Cookie khỏi trình duyệt">
                Xóa Cookie
            </a>
        </div>

        <!-- Alert Notification -->
        <div th:if="${message != null}"
             th:class="${isSuccess} ? 'alert alert-success' : 'alert alert-danger'">
            <span th:text="${message}">Thông báo</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/dologin}" th:object="${user}" method="post">
            <!-- Email Field -->
            <div class="form-group">
                <label class="form-label" for="email">Địa chỉ Email</label>
                <div class="input-wrapper">
                    <div class="input-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"></path>
                        </svg>
                    </div>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           placeholder="name@example.com" required autofocus />
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <div class="input-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           placeholder="••••••••" required />
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>

        <!-- Demo Credentials -->
        <div class="demo-box">
            <div><strong>Tài khoản mẫu để thử nghiệm:</strong></div>
            <div class="demo-row">
                <span>Email:</span>
                <span class="demo-tag">admin@gmail.com</span>
            </div>
            <div class="demo-row">
                <span>Mật khẩu:</span>
                <span class="demo-tag">12345</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
